server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx build in the `Server` response header
    # (ZAP 10036, low). `off` still sends "nginx" but without the version.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Directory-style requests under /assets/ (`/assets/`, `/assets/./`) must not
    # 403. nginx's directory-index refusal is what ZAP's "Bypassing 403" (40038,
    # medium) latches onto: it sees a 403 and finds that `/assets/../` answers
    # 200. That 200 is only the public SPA shell from `location /` — no directory
    # listing is ever exposed — so the alert is a false positive, but 404 is also
    # the more accurate answer for a path with no index. Regex locations take
    # precedence over the prefix location below, so this must come first.
    location ~ ^/assets/(.*/)?$ {
        return 404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Bare /favicon.ico requests (browser default) — the SPA ships favicon.svg,
    # so answer 204 instead of falling through to index.html.
    location = /favicon.ico {
        return 204;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
