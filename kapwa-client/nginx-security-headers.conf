# Security headers for the SPA responses.
#
# Why this is a separate file rather than a server-level block: nginx inherits
# `add_header` directives from an outer level *only if the inner block declares
# none of its own*. Every SPA location below sets `Cache-Control`, so a
# server-level list would be silently dropped in exactly the locations that
# matter. `include` puts the same list in each of them instead.
#
# The proxied locations (`/api/`, `/socket.io/`) deliberately do NOT include
# this: the NestJS API already sends the equivalent headers via helmet, and
# re-declaring them here would duplicate every one of them in the response.
#
# CSP notes:
#   script-src 'self' — the Vite production build emits only external module
#     scripts (`<script type="module" src="/assets/…">`), so no inline or eval
#     allowance is needed. The dev server (vite.config.ts) needs both for HMR;
#     production does not.
#   style-src-elem hashes — two third-party libraries inject a stylesheet at
#     runtime instead of shipping one: sonner (toast styles) and Radix
#     ScrollArea (scrollbar reset). Each is a constant compiled into the
#     bundle, so the policy pins them by SHA-256 rather than opening
#     style-src to 'unsafe-inline'. If either prints a console CSP violation
#     after a dependency bump, re-read the hash from the violation message
#     (the browser prints the expected sha256) and update it here.
#     The empty-string hash covers a transient empty <style> some component
#     mounts during hydration; an empty stylesheet is inert.
#   style-src-attr 'unsafe-inline' — Radix applies inline style *attributes*
#     (popper positioning, animations). Keeping it on style-src-attr rather
#     than style-src leaves <style> elements and stylesheets at 'self' and
#     keeps ZAP's medium 'CSP: style-src unsafe-inline' (10055-6) clear.
#   fonts.googleapis.com / fonts.gstatic.com — index.css imports Geist and
#     Source Sans 3 from Google Fonts.
#   connect-src 'self' — the SPA calls the API through the same origin
#     (`/api/v1`, proxied below) and opens sockets against same-origin
#     (`VITE_WS_URL` is empty in the production build).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-elem 'self' https://fonts.googleapis.com 'sha256-CIxDM5jnsGiKqXs2v7NKCY5MzdR9gu6TtiMJrDw29AY=' 'sha256-vGQdhYJbTuF+M8iCn1IZCHpdkiICocWHDq4qnQF4Rjw=' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='; style-src-attr 'unsafe-inline'; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Site isolation against Spectre-style speculative reads (ZAP 90004 / CWE-693).
# `require-corp` is safe here because the only cross-origin subresources are the
# two Google Fonts hosts, and both answer with
# `Cross-Origin-Resource-Policy: cross-origin`.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
