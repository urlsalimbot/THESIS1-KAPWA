# ============================================================
# KAPWA — AWS production stack (API only)
# ============================================================
# Postgres lives on RDS, object storage on S3, the SPA on S3 + CloudFront,
# so this stack has no db / minio / client / caddy services. CloudFront (or an
# ALB) fronts the API; do NOT expose port 3000 to the internet.
#
# Deploy from kapwa-server/:
#   docker compose -f docker-compose.aws.yml up -d --build
# ============================================================
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kapwa-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Manila
      NODE_ENV: production
    env_file:
      - ../infra/.env.production
    healthcheck:
      test: ["CMD", "node", "-e", 'http=require("http");http.get("http://localhost:3000/api/v1/health",r=>process.exit(r.statusCode<500?0:1)).on("error",()=>process.exit(1))']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
