# Test override — adds MailHog and points the API's transactional email at it.
#
# Usage from kapwa-server/:
#   podman-compose -f docker-compose.yml -f docker-compose.mailhog.yml up -d --build
#
#   MailHog UI : http://localhost:8025
#   SMTP       : mailhog:1025 (in-network) / localhost:1025 (host)
#   Stack entry: http://localhost:8090  (Caddy → client, /api/* → api)
#
# `environment` overrides win over the base service's env_file, so the
# production SMTP credentials in infra/.env.production are not used here.
services:
  mailhog:
    image: docker.io/mailhog/mailhog:latest
    container_name: kapwa-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    environment:
      EMAIL_HOST: mailhog
      EMAIL_PORT: "1025"
      EMAIL_USER: mailhog
      EMAIL_PASS: mailhog
      EMAIL_FROM: "KAPWA MSWDO <noreply@mswdo.test>"
      APP_URL: "http://localhost:8090"
      # The bundled Postgres serves plaintext; infra/.env.production sets
      # DB_SSL=true for RDS, which makes the API fail every boot with
      # "The server does not support SSL connections".
      DB_SSL: "false"
      # The compose file initialises Postgres from ${DB_PASSWORD:-kapwa}
      # interpolated from the *shell*, while the API reads DB_PASSWORD from
      # env_file — so pin the API to the password the bundled DB was created
      # with, otherwise auth fails with "password authentication failed".
      DB_PASSWORD: "kapwa"
