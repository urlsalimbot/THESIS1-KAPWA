name: Deploy AWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  api:
    # Self-hosted runner installed ON the EC2 API host (label: kapwa-aws).
    # No inbound SSH from GitHub is required — the runner builds in place.
    # Setup + secrets: docs/DEPLOYMENT-AWS.md → "Continuous deployment".
    runs-on: [self-hosted, kapwa-aws]
    timeout-minutes: 30
    environment: production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Ensure tooling
        run: |
          command -v rsync  >/dev/null || { echo 'rsync not found';  exit 1; }
          command -v docker >/dev/null || { echo 'docker not found'; exit 1; }

      - name: Sync repository to the deploy path
        # The server's own infra/.env.production (gitignored, holds real
        # secrets) is never overwritten.
        run: |
          rsync -az --delete --exclude '.git/' \
            --exclude 'node_modules/' --exclude 'dist/' --exclude 'coverage/' \
            --exclude '.planning/' --exclude '.superpowers/' \
            --exclude '.playwright-mcp/' --exclude '*.log' \
            --exclude 'infra/.env.production' --exclude 'infra/.env' \
            --exclude 'kapwa-server/docker-compose.override.yml' \
            ./ "${{ vars.DEPLOY_PATH || '/opt/kapwa' }}/"

      - name: Deploy API
        env:
          AWS_HOST: local
          AWS_PROFILE_NAME: ""
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/kapwa' }}
        run: |
          cd "$DEPLOY_PATH"
          chmod +x deploy-aws.sh
          ./deploy-aws.sh api

  frontend:
    # GitHub-hosted runner: builds the SPA and publishes it to S3 + CloudFront.
    # Needs AWS credentials limited to the frontend bucket + invalidation
    # (secrets AWS_DEPLOY_ACCESS_KEY_ID / AWS_DEPLOY_SECRET_ACCESS_KEY).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kapwa-client/package-lock.json

      - name: Install client dependencies
        working-directory: kapwa-client
        run: npm ci

      - name: Build and publish SPA
        env:
          AWS_HOST: local
          AWS_PROFILE_NAME: ""
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          AWS_REGION_NAME: ap-southeast-1
        run: |
          chmod +x deploy-aws.sh
          ./deploy-aws.sh frontend
