name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key when provided, otherwise accept on first connect.
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" -p "${{ secrets.DEPLOY_PORT || 22 }}" 'echo ssh-ok'

      - name: Sync repository to server
        # --delete keeps the server tree in sync with git. The server's own
        # infra/.env.production (gitignored, holds real secrets) and the
        # podman-local override are explicitly preserved/excluded.
        run: |
          rsync -avz --delete --exclude '.git/' \
            --exclude 'node_modules/' --exclude 'dist/' --exclude 'coverage/' \
            --exclude '.planning/' --exclude '.superpowers/' \
            --exclude '.playwright-mcp/' --exclude '*.log' \
            --exclude 'infra/.env.production' --exclude 'infra/.env' \
            --exclude 'kapwa-server/docker-compose.override.yml' \
            -e "ssh -p ${{ secrets.DEPLOY_PORT || 22 }}" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}"

      - name: Run deployment
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT || 22 }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd "${{ secrets.DEPLOY_PATH }}" && chmod +x deploy.sh && ./deploy.sh'