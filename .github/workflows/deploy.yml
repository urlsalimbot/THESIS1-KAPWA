name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    environment: production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Ensure rsync is available
        run: |
          command -v rsync >/dev/null || { echo 'rsync not found'; exit 1; }

      - name: Sync repository to /opt/kapwa
        # Runs locally on the server PC (self-hosted runner) — no SSH needed.
        # The server's own infra/.env.production (gitignored, holds real
        # secrets) and the podman-local override are explicitly preserved.
        run: |
          rsync -avz --delete --exclude '.git/' \
            --exclude 'node_modules/' --exclude 'dist/' --exclude 'coverage/' \
            --exclude '.planning/' --exclude '.superpowers/' \
            --exclude '.playwright-mcp/' --exclude '*.log' \
            --exclude 'infra/.env.production' --exclude 'infra/.env' \
            --exclude 'kapwa-server/docker-compose.override.yml' \
            ./ "${{ secrets.DEPLOY_PATH || '/opt/kapwa' }}/"

      - name: Run deployment
        run: |
          cd "${{ secrets.DEPLOY_PATH || '/opt/kapwa' }}" \
            && chmod +x deploy.sh \
            && ./deploy.sh