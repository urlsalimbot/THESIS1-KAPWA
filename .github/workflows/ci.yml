name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kapwa-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kapwa-server/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Audit production dependencies
        # Fails on an unallowlisted high/critical advisory in anything that
        # ships. The only allowlisted chain is MinIO's transitive CJS
        # query-string packages (no patched CJS release).
        run: node ../.github/scripts/audit-gate.mjs
      - name: Lint
        # run without --fix so violations fail the build
        run: npx eslint "{src,test}/**/*.ts"
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npx jest --silent

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kapwa-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kapwa-client/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        # Fails on an unallowlisted high/critical advisory in anything that
        # ships. The only allowlisted chain is MinIO's transitive CJS
        # query-string packages (no patched CJS release).
        run: node ../.github/scripts/audit-gate.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test:run
      - name: Build
        run: npm run build

  client-coverage:
    needs: client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kapwa-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kapwa-client/package-lock.json
      - run: npm ci
      - run: npm run coverage:check
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: kapwa-client/coverage/
          retention-days: 30

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose -f kapwa-server/docker-compose.yml build

  schema-parity:
    # The fresh-boot bootstrap (migrate.js) and the TypeORM migration chain are
    # two ways to build the same schema, and nothing compared them: a change
    # landing in one and not the other stays invisible until someone installs
    # fresh or upgrades. This job builds BOTH on empty databases and diffs the
    # result against a recorded baseline, so a NEW divergence fails the build.
    # Known differences: kapwa-server/scripts/schema-parity.baseline.txt
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kapwa-server
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kapwa
          POSTGRES_PASSWORD: kapwa
          POSTGRES_DB: kapwa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kapwa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kapwa-server/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Bootstrap vs migration chain
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: kapwa
          DB_PASSWORD: kapwa
        run: ./scripts/schema-parity.sh
      - name: Upload the schema diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-parity-diff
          path: /tmp/schema-parity.diff
          retention-days: 14

  e2e:
    # Browser smoke tests (audit §3.3). Thousands of unit tests mock the router,
    # the session and the API; these three drive the built SPA against a real API
    # and a real database, which is how every UI regression of the last month was
    # actually found. Blocking since its green run on 2026-10-16 — it is the only
    # job that exercises a production build end to end, so a failure here is
    # worth stopping a deploy for.
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kapwa
          POSTGRES_PASSWORD: kapwa
          POSTGRES_DB: kapwa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kapwa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: kapwa
      DB_PASSWORD: kapwa
      DB_NAME: kapwa
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # Two apps, two lockfiles, none at the root: without this the npm
          # cache step fails before a single test runs.
          cache-dependency-path: |
            kapwa-server/package-lock.json
            kapwa-client/package-lock.json
      - name: Install the API
        working-directory: kapwa-server
        run: npm ci --legacy-peer-deps
      - name: Build the API
        working-directory: kapwa-server
        run: npm run build
      - name: Create the schema (the bootstrap is the fresh-install path)
        working-directory: kapwa-server
        run: npm run migrate
      - name: Seed the accounts the smoke tests sign in with
        working-directory: kapwa-server
        run: npx ts-node src/database/seed-accounts.ts
      - name: Start the API
        working-directory: kapwa-server
        run: |
          nohup node dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/v1/health > /dev/null; then echo "API up"; exit 0; fi
            sleep 2
          done
          echo "API did not come up:"; tail -40 /tmp/api.log; exit 1
      - name: Install the client
        working-directory: kapwa-client
        run: npm ci
      - name: Install the browser
        working-directory: kapwa-client
        run: npx playwright install --with-deps chromium
      - name: Run the smoke tests
        working-directory: kapwa-client
        run: npx playwright test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: kapwa-client/playwright-report/
          retention-days: 14
