name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kapwa-server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kapwa
          POSTGRES_USER: kapwa
          POSTGRES_PASSWORD: kapwa
        options: >-
          --health-cmd pg_isready -U kapwa
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kapwa-server/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Lint
        # run without --fix so violations fail the build
        run: npx eslint "{src,test}/**/*.ts"
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npx jest --silent
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: kapwa
          DB_PASSWORD: kapwa
          DB_NAME: kapwa

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kapwa-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kapwa-client/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test:run
      - name: Build
        run: npm run build

  client-coverage:
    needs: client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kapwa-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kapwa-client/package-lock.json
      - run: npm ci
      - run: npm run coverage:check
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: kapwa-client/coverage/
          retention-days: 30

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose -f kapwa-server/docker-compose.yml build